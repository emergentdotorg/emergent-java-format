[versions]
# libraries
assertj = "3.27.7"
java-semver = "0.10.2"
jspecify = "1.0.0"
junit = "4.13.2"
junit-platform = "1.14.2"
junit-jupiter = "5.10.0"
opentest4j = "1.3.0"
truth = "1.4.5"
java-format = "3.0.0-SNAPSHOT"

# plugins
changelog = "2.5.0"

# https://plugins.jetbrains.com/docs/intellij/using-kotlin.html#kotlin-standard-library

intelliJPlatform = "2.10.2"
kotlin = "2.1.20"
kover = "0.9.5"
qodana = "2025.3.1"

[libraries]
assertjCore = { group = "org.assertj", name = "assertj-core", version.ref = "assertj" }
java-format = { group = "org.emergent.javaformat", name="java-format", version.ref = "java-format" }
javaSemver = { group = "com.github.zafarkhaja", name = "java-semver", version.ref = "java-semver" }
jspecify = { group = "org.jspecify", name="jspecify", version.ref = "jspecify" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
junitPlatformLaucnher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit-jupiter" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit-jupiter" }
junit-jupiter-migrationsupport = { module = "org.junit.jupiter:junit-jupiter-migrationsupport", version.ref = "junit-jupiter" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit-jupiter" }
opentest4j = { group = "org.opentest4j", name = "opentest4j", version.ref = "opentest4j" }
truth = { group = "com.google.truth", name = "truth", version.ref = "truth" }

[bundles]
javaFormat = ["java-format"]
junitJupiter = ["junit-jupiter-api", "junit-jupiter-engine", "junit-jupiter-migrationsupport", "junit-jupiter-params"]

[plugins]
changelog = { id = "org.jetbrains.changelog", version.ref = "changelog" }
intelliJPlatform = { id = "org.jetbrains.intellij.platform", version.ref = "intelliJPlatform" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
qodana = { id = "org.jetbrains.qodana", version.ref = "qodana" }
